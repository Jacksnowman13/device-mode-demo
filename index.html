<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content">
  <meta name="theme-color" content="#6d28d9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PrivacyFirst">
  <title>PrivacyFirst</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: #100825;
      color: #fff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 16%, rgba(168, 85, 247, 0.42), transparent 34%),
        linear-gradient(160deg, #251052 0%, #100825 58%, #090512 100%);
    }

    body::after {
      position: fixed;
      z-index: 20;
      top: 0;
      left: 50%;
      width: 210px;
      height: 32px;
      border-radius: 0 0 20px 20px;
      background: #000;
      content: "";
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%);
    }

    body.simulate-cutout::after {
      opacity: 1;
    }

    body.island::after {
      top: 11px;
      width: 126px;
      height: 37px;
      border-radius: 22px;
    }

    .trust-banner {
      position: fixed;
      z-index: 10;
      top: 0;
      right: 0;
      left: 0;
      width: 100%;
      min-height: 46px;
      padding: 0 14px;
      background: #f8dd3d;
      color: #1a1028;
      font-size: clamp(12px, 3.6vw, 20px);
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1;
      text-transform: uppercase;
    }

    .trust-banner span:first-child {
      position: absolute;
      top: 10px;
      right: calc(50% + 58px);
      white-space: nowrap;
    }

    .trust-banner .not {
      position: absolute;
      top: -2px;
      left: 50%;
      width: 110px;
      color: #b91c1c;
      font-size: 26px;
      line-height: 34px;
      text-align: center;
      transform: translateX(-50%);
    }

    .trust-banner span:last-child {
      position: absolute;
      top: 10px;
      left: calc(50% + 58px);
      white-space: nowrap;
    }

    body.island .trust-banner {
      min-height: 58px;
    }

    body.island .trust-banner span:first-child,
    body.island .trust-banner span:last-child {
      top: 21px;
    }

    body.island .trust-banner .not {
      top: 10px;
      font-size: 28px;
      line-height: 38px;
    }

    body.safe .trust-banner {
      top: env(safe-area-inset-top);
    }

    main {
      display: grid;
      min-height: calc(100vh - 46px);
      padding: 88px 24px 150px;
      place-items: center;
      text-align: center;
    }

    body.safe main {
      padding-top: calc(88px + env(safe-area-inset-top));
    }

    body.island main {
      min-height: calc(100vh - 58px);
      padding-top: 102px;
    }

    body.safe.island main {
      padding-top: calc(102px + env(safe-area-inset-top));
    }

    .card {
      width: min(100%, 520px);
      padding: 30px 24px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(18px);
    }

    .brand {
      margin-bottom: 22px;
      color: #d8b4fe;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 460px;
      margin: 0 auto 12px;
      font-size: clamp(38px, 11vw, 70px);
      letter-spacing: -0.065em;
      line-height: 0.94;
    }

    .amount {
      color: #f8dd3d;
    }

    .subtitle {
      max-width: 360px;
      margin: 0 auto 28px;
      color: #ddd6fe;
      font-size: 17px;
      line-height: 1.45;
    }

    form {
      display: grid;
      gap: 12px;
    }

    label {
      font-size: 13px;
      font-weight: 700;
      text-align: left;
    }

    input,
    button {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 14px;
      font: inherit;
    }

    input {
      padding: 0 16px;
      outline: 2px solid transparent;
      background: #fff;
      color: #1a1028;
    }

    input:focus {
      outline-color: #f8dd3d;
    }

    button {
      padding: 0 18px;
      background: #f8dd3d;
      color: #1a1028;
      cursor: pointer;
      font-weight: 900;
    }

    .fine-print {
      margin: 16px 0 0;
      color: #a78bfa;
      font-size: 11px;
    }

    .escape {
      position: fixed;
      z-index: 4;
      right: 14px;
      bottom: 14px;
      left: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      padding: 12px 16px;
      border: 2px solid rgba(255, 255, 255, 0.42);
      border-radius: 18px;
      background: rgba(16, 8, 37, 0.92);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(16px);
    }

    body.safe .escape {
      bottom: max(14px, env(safe-area-inset-bottom), env(keyboard-inset-height));
      right: max(14px, env(safe-area-inset-right));
      left: max(14px, env(safe-area-inset-left));
    }

    .escape strong {
      display: block;
      font-size: 14px;
    }

    .escape small {
      color: #c4b5fd;
    }

    .escape-button {
      width: auto;
      min-height: 40px;
      padding: 0 14px;
      background: #fff;
      white-space: nowrap;
    }

    @media (max-width: 420px) {
      .trust-banner {
        padding-right: 6px;
        padding-left: 6px;
      }

      .trust-banner span:first-child {
        right: calc(50% + 52px);
      }

      .trust-banner span:last-child {
        left: calc(50% + 52px);
      }

      .trust-banner .not {
        width: 100px;
        font-size: 26px;
      }

      main {
        padding-right: 16px;
        padding-left: 16px;
      }

      .card {
        padding: 26px 18px;
      }
    }
  </style>
</head>
<body>
  <header class="trust-banner" aria-label="Your data is not for sale">
    <span>Your data is</span>
    <span class="not">not</span>
    <span>for sale</span>
  </header>

  <main>
    <section class="card">
      <div class="brand">PrivacyFirst</div>
      <h1>Your secrets are <span class="amount">safe</span> with us.</h1>
      <p class="subtitle">
        Join the only newsletter with absolutely no monetization strategy.
      </p>

      <form id="signup">
        <label for="email">Email address</label>
        <input
            id="email"
            name="email"
            type="email"
            inputmode="email"
            autocomplete="email"
            placeholder="you@example.com">
        <button type="submit">Accept all and continue</button>
      </form>

      <p class="fine-print">* Privacy policy subject to profitable reinterpretation.</p>
    </section>
  </main>

  <aside class="escape">
    <div>
      <strong>Prefer privacy?</strong>
      <small>Tracking is completely optional.</small>
    </div>
    <button class="escape-button" type="button">Decline all</button>
  </aside>

  <script>
    const params = new URLSearchParams(location.search);
    document.body.classList.toggle("safe", params.has("safe"));
    document.body.classList.toggle("simulate-cutout", params.has("simulate"));
    document.body.classList.toggle("island", params.has("island"));

    if ("virtualKeyboard" in navigator) {
      navigator.virtualKeyboard.overlaysContent = true;
    }

    document.querySelector("#signup").addEventListener("submit", event => {
      event.preventDefault();
    });

    document.querySelector(".escape-button").addEventListener("click", () => {
      document.querySelector("#email").blur();
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>
</body>
</html>
