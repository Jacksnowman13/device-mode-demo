<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content">
  <meta name="theme-color" content="#6d28d9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Totally Legit">
  <title>Totally Legit Finance</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: #100825;
      color: #fff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 16%, rgba(168, 85, 247, 0.42), transparent 34%),
        linear-gradient(160deg, #251052 0%, #100825 58%, #090512 100%);
    }

    body::after {
      position: fixed;
      z-index: 20;
      top: 0;
      left: 50%;
      width: 210px;
      height: 32px;
      border-radius: 0 0 20px 20px;
      background: #000;
      content: "";
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%);
    }

    body.simulate-cutout::after {
      opacity: 1;
    }

    body.island::after {
      top: 11px;
      width: 126px;
      height: 37px;
      border-radius: 22px;
    }

    .trust-banner {
      position: relative;
      z-index: 2;
      width: 100%;
      min-height: 76px;
      padding: 0 14px;
      background: #f8dd3d;
      color: #1a1028;
      font-size: clamp(12px, 3.6vw, 20px);
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1;
      text-transform: uppercase;
    }

    .trust-banner span:first-child {
      position: absolute;
      top: 20px;
      right: calc(50% + 105px);
      white-space: nowrap;
    }

    .trust-banner .not {
      position: absolute;
      top: 14px;
      left: 50%;
      width: 70px;
      color: #b91c1c;
      font-size: 24px;
      line-height: 32px;
      text-align: center;
      transform: translateX(-50%);
    }

    .trust-banner span:last-child {
      position: absolute;
      top: 20px;
      left: calc(50% + 105px);
      white-space: nowrap;
    }

    body.island .trust-banner span:first-child {
      right: calc(50% + 65px);
    }

    body.island .trust-banner span:last-child {
      left: calc(50% + 65px);
    }

    body.island .trust-banner .not {
      top: 11px;
    }

    body.safe .trust-banner {
      min-height: calc(76px + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
    }

    main {
      display: grid;
      min-height: calc(100vh - 76px);
      padding: 44px 24px 150px;
      place-items: center;
      text-align: center;
    }

    .card {
      width: min(100%, 520px);
      padding: 30px 24px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(18px);
    }

    .brand {
      margin-bottom: 22px;
      color: #d8b4fe;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 460px;
      margin: 0 auto 12px;
      font-size: clamp(38px, 11vw, 70px);
      letter-spacing: -0.065em;
      line-height: 0.94;
    }

    .amount {
      color: #f8dd3d;
    }

    .subtitle {
      max-width: 360px;
      margin: 0 auto 28px;
      color: #ddd6fe;
      font-size: 17px;
      line-height: 1.45;
    }

    form {
      display: grid;
      gap: 12px;
    }

    label {
      font-size: 13px;
      font-weight: 700;
      text-align: left;
    }

    input,
    button {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 14px;
      font: inherit;
    }

    input {
      padding: 0 16px;
      outline: 2px solid transparent;
      background: #fff;
      color: #1a1028;
    }

    input:focus {
      outline-color: #f8dd3d;
    }

    button {
      padding: 0 18px;
      background: #f8dd3d;
      color: #1a1028;
      cursor: pointer;
      font-weight: 900;
    }

    .fine-print {
      margin: 16px 0 0;
      color: #a78bfa;
      font-size: 11px;
    }

    .escape {
      position: fixed;
      z-index: 4;
      right: 14px;
      bottom: 14px;
      left: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      padding: 12px 16px;
      border: 2px solid rgba(255, 255, 255, 0.42);
      border-radius: 18px;
      background: rgba(16, 8, 37, 0.92);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(16px);
    }

    body.safe .escape {
      bottom: max(14px, env(safe-area-inset-bottom), env(keyboard-inset-height));
      right: max(14px, env(safe-area-inset-right));
      left: max(14px, env(safe-area-inset-left));
    }

    .escape strong {
      display: block;
      font-size: 14px;
    }

    .escape small {
      color: #c4b5fd;
    }

    .escape-button {
      width: auto;
      min-height: 40px;
      padding: 0 14px;
      background: #fff;
      white-space: nowrap;
    }

    @media (max-width: 420px) {
      .trust-banner {
        padding-right: 6px;
        padding-left: 6px;
      }

      .trust-banner .not {
        width: 70px;
        font-size: 24px;
      }

      main {
        padding-right: 16px;
        padding-left: 16px;
      }

      .card {
        padding: 26px 18px;
      }
    }
  </style>
</head>
<body>
  <header class="trust-banner" aria-label="We will not scam you">
    <span>We will</span>
    <span class="not">not</span>
    <span>scam you</span>
  </header>

  <main>
    <section class="card">
      <div class="brand">Totally Legit Finance</div>
      <h1>Your <span class="amount">$1,000,000</span> is waiting.</h1>
      <p class="subtitle">
        Guaranteed returns from a company you discovered five seconds ago.
      </p>

      <form id="signup">
        <label for="card-number">Credit card number (for verification)</label>
        <input
            id="card-number"
            name="card-number"
            inputmode="numeric"
            autocomplete="off"
            placeholder="1234 5678 9012 3456">
        <button type="submit">Trust us</button>
      </form>

      <p class="fine-print">* Legitimacy not independently verified.</p>
    </section>
  </main>

  <aside class="escape">
    <div>
      <strong>Changed your mind?</strong>
      <small>You can still escape.</small>
    </div>
    <button class="escape-button" type="button">No thanks</button>
  </aside>

  <script>
    const params = new URLSearchParams(location.search);
    document.body.classList.toggle("safe", params.has("safe"));
    document.body.classList.toggle("simulate-cutout", params.has("simulate"));
    document.body.classList.toggle("island", params.has("island"));

    if ("virtualKeyboard" in navigator) {
      navigator.virtualKeyboard.overlaysContent = true;
    }

    document.querySelector("#signup").addEventListener("submit", event => {
      event.preventDefault();
    });

    document.querySelector(".escape-button").addEventListener("click", () => {
      document.querySelector("#card-number").blur();
    });

    if (params.has("test")) {
      document.body.classList.add("simulate-cutout");
      const island = params.has("island");
      const targetScroll = island ? 0 : 14;

      requestAnimationFrame(() => {
        window.scrollTo(0, targetScroll);
        requestAnimationFrame(() => {
          const notRect = document.querySelector(".not").getBoundingClientRect();
          const bannerRect =
              document.querySelector(".trust-banner").getBoundingClientRect();
          const cutout = island ?
              {left: (innerWidth - 126) / 2, right: (innerWidth + 126) / 2,
                top: 11, bottom: 48} :
              {left: (innerWidth - 210) / 2, right: (innerWidth + 210) / 2,
                top: 0, bottom: 32};
          const covered =
              notRect.left >= cutout.left &&
              notRect.right <= cutout.right &&
              notRect.top >= cutout.top &&
              notRect.bottom <= cutout.bottom;
          const yellowBelow = bannerRect.bottom > cutout.bottom;
          const panel = document.createElement("pre");
          panel.style.cssText =
              "position:fixed;z-index:100;right:8px;bottom:88px;margin:0;" +
              "padding:10px;border-radius:8px;background:#000;color:#fff;" +
              "font:12px/1.4 monospace";
          panel.textContent =
              `${covered && yellowBelow ? "PASS" : "FAIL"}\n` +
              `NOT: ${JSON.stringify(notRect.toJSON())}\n` +
              `cutout: ${JSON.stringify(cutout)}\n` +
              `yellow below: ${yellowBelow}`;
          document.body.append(panel);
        });
      });
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>
</body>
</html>
